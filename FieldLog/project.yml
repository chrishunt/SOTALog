name: FieldLog
options:
  bundleIdPrefix: com.fieldlog
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  FieldLog:
    type: application
    platform: iOS
    sources:
      - path: FieldLog
    resources:
      - path: FieldLog/Resources/Assets.xcassets
      - path: FieldLog/Resources/CallPrefixes.json
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "FieldLog uses your location to calculate your Maidenhead grid square for logging."
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fieldlog.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GRDB

  FieldLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FieldLogTests
    dependencies:
      - target: FieldLog
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
