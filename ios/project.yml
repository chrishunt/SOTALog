name: SOTALog
options:
  bundleIdPrefix: com.sotalog
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  SOTALog:
    type: application
    platform: iOS
    sources:
      - path: SOTALog
    resources:
      - path: SOTALog/Resources/Assets.xcassets
      - path: SOTALog/Resources/CallPrefixes.json
      - path: SOTALog/Resources/PrivacyInfo.xcprivacy
    info:
      path: SOTALog/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            sotacat.local:
              NSExceptionAllowsInsecureHTTPLoads: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sotalog.adi
            UTTypeConformsTo:
              - public.data
            UTTypeDescription: ADIF Log File
            UTTypeTagSpecification:
              public.filename-extension:
                - adi
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SOTA Log can connect to a SOTACat radio control device on your local network."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SOTA Log uses your location to calculate your Maidenhead grid square for logging."
        INFOPLIST_KEY_CFBundleDisplayName: "SOTA Log"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sotalog.app
        DEVELOPMENT_TEAM: 8CV6QZZ6BE # Replace with your Apple Developer Team ID
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: 19
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GRDB

  SOTALogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SOTALogTests
    dependencies:
      - target: SOTALog
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
